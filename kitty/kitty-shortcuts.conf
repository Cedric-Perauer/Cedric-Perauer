# kitty shortcuts — extracted from ~/.config/kitty/kitty.conf
# Captured 2026-09-22. These are the only non-default lines in that file
# (3510 lines total, 13 active; everything else is kitty's stock comments).
#
# Restore: append to ~/.config/kitty/kitty.conf, or
#   include /Users/cedric/Documents/dotfiles/kitty/kitty-shortcuts.conf

# Required for the opt+v / opt+h splits below to work
enabled_layouts splits,stack

# --- tabs ---
map cmd+w new_tab
map cmd+q close_tab
map cmd+d next_tab
map cmd+s previous_tab

# --- splits (new window in current dir) ---
map opt+v launch --location=vsplit --cwd=current
map opt+h launch --location=hsplit --cwd=current

# --- move between splits ---
map cmd+left  neighboring_window left
map cmd+right neighboring_window right
map cmd+up    neighboring_window up
map cmd+down  neighboring_window down

# --- quit / close ---
map cmd+shift+q quit
map cmd+r close_window
