# Preserve sessions when clients disconnect and retain panes after commands exit.
set-option -g destroy-unattached off
set-option -s exit-unattached off
set-option -g remain-on-exit off

# Option (Alt) + arrow switches panes without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Mouse: drag a pane border to resize, click a pane to select it, wheel to scroll
set -g mouse on

# Prefix then h splits left/right. Prefix then r splits top/bottom.
bind-key -N "Split into columns" h split-window -h -c "#{pane_current_path}"
bind-key -N "Split into rows"    r split-window -v -c "#{pane_current_path}"
